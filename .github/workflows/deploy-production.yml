name: Deploy production

# Release by pushing a v* tag after its commit has reached main.
# A branches filter here would also trigger untagged pushes to main.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Serialize releases without interrupting a deployment already in progress.
concurrency:
  group: failoverly-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      # TODO: Create this GitHub environment and allow deployment tags matching v*.
      name: production
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        shell: bash
    env:
      VERCEL_CLI_VERSION: '59.23.2'
      VERCEL_TELEMETRY_DISABLED: '1'
      # TODO: Add these secrets in GitHub's production environment or repository.
      # VERCEL_ORG_ID and VERCEL_PROJECT_ID come from .vercel/project.json after linking.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # Use the event's immutable SHA even if the tag is subsequently moved.
          ref: ${{ github.sha }}
          # Fetch current main and all history for the ancestry check below.
          fetch-depth: 0
          persist-credentials: false

      - name: Require the release commit to be on main
        run: |
          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "::error::The remote main branch was not found; production releases must come from main."
            exit 1
          fi
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo "::error::The tagged commit is not on origin/main. Merge it into main before pushing a release tag."
            exit 1
          fi

      - name: Validate Vercel configuration
        run: |
          missing=0
          for variable in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Missing $variable. Add it as a GitHub secret for the production environment or repository."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js for the Vercel CLI
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.11'

      - name: Pull Vercel production settings
        run: npm exec --yes --package="vercel@$VERCEL_CLI_VERSION" -- vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifacts
        # vercel.json installs with the frozen Bun lockfile and runs bun run build.
        run: npm exec --yes --package="vercel@$VERCEL_CLI_VERSION" -- vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy production artifacts
        id: deploy
        run: |
          deployment_url=$(npm exec --yes --package="vercel@$VERCEL_CLI_VERSION" -- vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")
          printf 'url=%s\n' "$deployment_url" >> "$GITHUB_OUTPUT"
          printf 'Production deployment: %s\n' "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
